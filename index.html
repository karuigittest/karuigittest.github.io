<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Flow Board</title>

<style>

/* ===== 全体 ===== */

body{
    background:#f2eee9;
    margin:0;
    padding:40px 24px;
    font-family:
        "Helvetica Neue",
        "Arial",
        "Hiragino Sans",
        "Meiryo",
        sans-serif;
    color:#4a443f;
}

/* ===== タイトル ===== */

h1{
    font-size:1.45rem;
    color:#766d64;
    letter-spacing:0.08em;
    margin-top:0;
    margin-bottom:26px;
}

/* ===== 上部 ===== */

.top-bar{
    display:flex;
    gap:12px;
    margin-bottom:28px;
    flex-wrap:wrap;
}

.top-btn{
    background:#a3b18a;
    color:white;
    border:none;
    padding:9px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.88rem;
    transition:0.25s;
    font-weight:bold;
    box-shadow:0 2px 6px rgba(0,0,0,0.04);
}

.top-btn:hover{
    opacity:0.9;
}

.edit-on{
    background:#588157;
}

.reset-btn{
    background:#d17a5d;
}

.reset-btn:hover{
    background:#b56348;
}

/* ===== 曜日 ===== */

.week-row{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:18px;
    margin-bottom:26px;
}

.mini-card{
    background:#ffffff;
    border-radius:20px;
    padding:18px;
    border:1px solid #e5dfd8;
    box-shadow:0 8px 20px rgba(0,0,0,0.05);
}

.mini-card h3{
    margin-top:0;
    margin-bottom:12px;
    font-size:0.95rem;
    color:#588157;
    border-bottom:2px solid #ccd5ae;
    padding-bottom:8px;
    letter-spacing:0.05em;
}

/* ===== メイン ===== */

.board{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
}

.card{
    background:#ffffff;
    border-radius:20px;
    padding:24px;
    border:1px solid #e5dfd8;
    box-shadow:0 8px 20px rgba(0,0,0,0.05);
    width:260px;
    display:flex;
    flex-direction:column;
}

.card h2{
    font-size:1rem;
    margin-top:0;
    margin-bottom:16px;
    padding-bottom:10px;
    letter-spacing:0.05em;
}

.inbox-title{
    color:#6b705c;
    border-bottom:2px solid #a3b18a;
}

.routine-title{
    color:#588157;
    border-bottom:2px solid #ccd5ae;
}

.review-title{
    color:#588157;
    border-bottom:2px solid #ccd5ae;
}

.sandbox-title{
    color:#8c786c;
    border-bottom:2px solid #dcd5cc;
}


/* ===== 達成率 ===== */

.progress{
    margin-top:-7px;
    margin-bottom:14px;
    font-size:0.78rem;
    color:#8a827a;
}

.progress-text{
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.progress-percent{
    font-weight:bold;
    color:#6b705c;
}

.progress-bar{
    width:100%;
    height:6px;
    background:#eee9e3;
    border-radius:999px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#a3b18a;
    border-radius:999px;
    transition:width 0.25s ease;
}

/* ===== 入力欄 ===== */

.input-row{
    display:flex;
    gap:6px;
    background:#f7f3ef;
    border:1px solid #dcd5cc;
    border-radius:10px;
    padding:5px;
    margin-bottom:16px;
}

.input-row input{
    border:none;
    background:transparent;
    flex:1;
    padding:8px;
    outline:none;
    font-size:0.86rem;
    color:#4a443f;
}

.post-btn{
    background:#6b705c;
    color:white;
    border:none;
    padding:0 14px;
    border-radius:7px;
    cursor:pointer;
    font-size:0.85rem;
}

.sandbox-btn{
    background:#8c786c;
}

/* ===== リスト ===== */

.task-list{
    list-style:none;
    padding:0;
    margin:0;
    min-height:100px;
}

/* ===== タスク ===== */

.task{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px 8px;
    border-bottom:1px dashed #dcd5cc;
    font-size:0.92rem;
    line-height:1.45;
    letter-spacing:0.02em;
    background:#ffffff;
    border-radius:6px;
    transition:0.2s;
    user-select:none;
}

.task:last-child{
    border-bottom:none;
}

.task.editable{
    cursor:grab;
}

.edit-mode .card{
    border:2px solid #b7c7a0;
}

.edit-mode .mini-card{

    border:2px solid #b7c7a0;

}
    cursor:grab;
}

.task.dragging{
    opacity:0.4;
    background:#f7f3ef;
}

/* ===== チェック ===== */

.check-btn{
    width:18px;
    height:18px;
    min-width:18px;
    border-radius:4px;
    border:2px solid #6b705c;
    background:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:white;
    margin-top:1px;
}

.task.done .check-btn{
    background:#6b705c;
    color:white;
}

.task.done span{
    text-decoration:line-through;
    color:#a8a29a;
    opacity:0.8;
}

/* ===== 重要 ===== */

.task.important{
    background:#edf2f7;
    border-left:4px solid #a3b18a;
    padding-left:6px;
}

.task.important span{
    color:#4a443f;
}

/* ===== 星 ===== */

.star-btn{
    display:none;
    background:none;
    border:1px solid #bcaaa4;
    color:#bcaaa4;
    border-radius:4px;
    font-size:0.72rem;
    padding:1px 5px;
    cursor:pointer;
    line-height:1.2;
    white-space:nowrap;
    margin-top:1px;
}

.edit-mode .star-btn{
    display:inline-block;
}

.task.important .star-btn{
    background:#a3b18a;
    border-color:#a3b18a;
    color:white;
}

/* ===== テキスト ===== */

.task span{
    flex:1;
    word-break:break-word;
}

/* ===== 削除 ===== */

.delete-btn{
    background:none;
    border:none;
    color:#bcaaa4;
    cursor:pointer;
    font-size:1rem;
    padding:0 2px;
    line-height:1;
    padding:4px;
}

.delete-btn:hover{
    color:#d17a5d;
}
/* ===== スマホ最適化 ===== */

@media (max-width:768px){

    body{
        padding:16px;
    }

    /* ヘッダー固定 */

    .top-bar{
        position:sticky;
        top:0;
        z-index:100;
        background:#f2eee9;
        padding-bottom:12px;
        margin-bottom:18px;
    }

    /* ボタン */

    .top-btn{
        width:100%;
        height:48px;
        font-size:1rem;
    }

    /* 曜日を横スクロール */

    .week-row{

        display:flex;
        overflow-x:auto;
        gap:12px;
        padding-bottom:8px;

        scrollbar-width:none;
    }

    .week-row::-webkit-scrollbar{
        display:none;
    }

    .mini-card{

        flex:0 0 130px;

        padding:14px;

    }

    .mini-card h3{

        text-align:center;

        font-size:1rem;

    }

    /* メインカード */

    .board{

        display:flex;

        flex-direction:column;

        gap:14px;

    }

    .card{

        width:auto;

        padding:18px;

    }

    /* 入力欄 */

    .input-row{

        margin-bottom:14px;

    }

    .input-row input{

        font-size:1rem;

        padding:12px;

    }

    .post-btn{

        min-width:56px;

    }

    /* タスク */

    .task{

        min-height:48px;

        font-size:1rem;

        padding:12px 8px;

    }

    /* チェック */

    .check-btn{

        width:24px;

        height:24px;

        min-width:24px;

        font-size:15px;

    }

}
</style>

<body>

<h1>FLOW BOARD</h1>

<div class="top-bar">

    <button
        class="top-btn reset-btn"
        onclick="clearAllDone()">
        毎週分をリセット
    </button>

    <button
        id="editBtn"
        class="top-btn"
        onclick="toggleEditMode()">
        移動モード: オフ
    </button>

</div>


<!-- ===== メイン ===== -->

<div class="board">

    <div class="card">

        <h2 class="inbox-title">
            Inbox
        </h2>

        <div class="progress">
            <div class="progress-text">
                <span class="progress-count">0 / 0 完了</span>
                <span class="progress-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="input-row">

            <input
                id="input1"
                placeholder="思いつきを追加">

            <button
                class="post-btn"
                onclick="addTask('list1','input1')">
                ＋
            </button>

        </div>

        <div
            class="task-list"
            id="list1">
        </div>

    </div>

    <div class="card">

        <h2 class="routine-title">
            Routine
        </h2>

        <div class="progress">
            <div class="progress-text">
                <span class="progress-count">0 / 0 完了</span>
                <span class="progress-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div
            class="task-list"
            id="list2">
        </div>

    </div>

    <div class="card">

        <h2 class="review-title">
            Review
        </h2>

        <div class="progress">
            <div class="progress-text">
                <span class="progress-count">0 / 0 完了</span>
                <span class="progress-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div
            class="task-list"
            id="list3">
        </div>

    </div>

    <div class="card">

        <h2 class="sandbox-title">
            Sandbox
        </h2>

        <div class="progress">
            <div class="progress-text">
                <span class="progress-count">0 / 0 完了</span>
                <span class="progress-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="input-row">

            <input
                id="input4"
                placeholder="アイデア・メモ">

            <button
                class="post-btn sandbox-btn"
                onclick="addTask('list4','input4')">
                ＋
            </button>

        </div>

        <div
            class="task-list"
            id="list4">
        </div>

    </div>

</div>

<script>

let draggedTask = null;
let editMode = false;

/* ===== 達成率 ===== */

function updateProgress(){
    document.querySelectorAll(".card").forEach(card=>{
        const list = card.querySelector(".task-list");
        const count = card.querySelector(".progress-count");
        const percent = card.querySelector(".progress-percent");
        const fill = card.querySelector(".progress-fill");

        if(!list || !count || !percent || !fill) return;

        const tasks = list.querySelectorAll(".task");
        const total = tasks.length;
        const done = list.querySelectorAll(".task.done").length;
        const rate = total === 0 ? 0 : Math.round((done / total) * 100);

        count.textContent = `${done} / ${total} 完了`;
        percent.textContent = `${rate}%`;
        fill.style.width = `${rate}%`;
    });
}

/* ===== 保存 ===== */

function saveData(){

    const data = {};

    document
    .querySelectorAll(".task-list")
    .forEach(list=>{

        data[list.id] = [];

        list
        .querySelectorAll(".task")
        .forEach(task=>{

            data[list.id].push({

                text:
                    task.querySelector("span")
                    .textContent,

                done:
                    task.classList
                    .contains("done"),

                important:
                    task.classList
                    .contains("important")
            });
        });
    });

    localStorage.setItem(
        "flowBoardData",
        JSON.stringify(data)
    );

    updateProgress();
}

/* ===== 読み込み ===== */

function loadData(){

    const data =
        JSON.parse(
            localStorage.getItem(
                "flowBoardData"
            )
        );

    if(!data){
        updateProgress();
        return;
    }

    Object.keys(data)
    .forEach(listId=>{

        data[listId]
        .forEach(item=>{

            const task =
                createTask(item.text);

            if(item.done){

                task.classList
                    .add("done");

                task
                .querySelector(".check-btn")
                .textContent = "✓";
            }

            if(item.important){

                task.classList
                    .add("important");
            }

            document
            .getElementById(listId)
            .appendChild(task);
        });
    });

    updateProgress();
}

/* ===== 編集モード ===== */

function toggleEditMode(){

    editMode = !editMode;

    const btn =
        document.getElementById("editBtn");

    if(editMode){

        btn.textContent =
            "移動モード: オン";

        btn.classList
            .add("edit-on");

        document.body
            .classList
            .add("edit-mode");

    }else{

        btn.textContent =
            "移動モード: オフ";

        btn.classList
            .remove("edit-on");

        document.body
            .classList
            .remove("edit-mode");
    }

    document
    .querySelectorAll(".task")
    .forEach(task=>{

        task.draggable = editMode;

        if(editMode){

            task.classList
                .add("editable");

        }else{

            task.classList
                .remove("editable");
        }
    });
}

/* ===== 追加 ===== */

function addTask(listId,inputId){

    const input =
        document.getElementById(inputId);

    if(input.value.trim()==="")
        return;

    const task =
        createTask(input.value);

    document
    .getElementById(listId)
    .prepend(task);

    input.value = "";

    saveData();
}

/* ===== 作成 ===== */

function createTask(text){

    const task =
        document.createElement("div");

    task.className = "task";

    task.draggable = editMode;

    if(editMode){

        task.classList
            .add("editable");
    }

    const check =
        document.createElement("button");

    check.className = "check-btn";

    check.onclick = ()=>{

        task.classList.toggle("done");

        if(
            task.classList
            .contains("done")
        ){

            check.textContent = "✓";

        }else{

            check.textContent = "";
        }

        saveData();
    };

    const star =
        document.createElement("button");

    star.className = "star-btn";

    star.textContent = "重要";

    star.onclick = ()=>{

        task.classList
            .toggle("important");

        saveData();
    };

    const span =
        document.createElement("span");

    span.textContent = text;

    const del =
        document.createElement("button");

    del.className = "delete-btn";

    del.textContent = "×";

    del.onclick = ()=>{

        task.remove();

        saveData();
    };

    task.appendChild(check);
    task.appendChild(star);
    task.appendChild(span);
    task.appendChild(del);

    task.addEventListener(
        "dragstart",
        ()=>{

        if(!editMode)
            return;

        draggedTask = task;

        setTimeout(()=>{

            task.classList
                .add("dragging");

        },0);
    });

    task.addEventListener(
        "dragend",
        ()=>{

        task.classList
            .remove("dragging");

        draggedTask = null;
    });

    return task;
}

/* ===== 並び替え ===== */

document
.querySelectorAll(".task-list")
.forEach(list=>{

    list.addEventListener(
        "dragover",
        (e)=>{

        if(!editMode)
            return;

        e.preventDefault();

        const afterElement =
            getDragAfterElement(
                list,
                e.clientY
            );

        if(afterElement == null){

            list.appendChild(
                draggedTask
            );

        }else{

            list.insertBefore(
                draggedTask,
                afterElement
            );
        }
    });

    list.addEventListener(
        "drop",
        ()=>{

        saveData();
    });
});

/* ===== 挿入位置 ===== */

function getDragAfterElement(
    container,
    y
){

    const draggableElements =
        [...container.querySelectorAll(
            ".task:not(.dragging)"
        )];

    return draggableElements.reduce(
        (closest, child)=>{

        const box =
            child.getBoundingClientRect();

        const offset =
            y - box.top - box.height / 2;

        if(
            offset < 0 &&
            offset > closest.offset
        ){

            return {
                offset: offset,
                element: child
            };

        }else{

            return closest;
        }

    },{
        offset:
            Number.NEGATIVE_INFINITY
    }).element;
}

/* ===== リセット ===== */

function clearAllDone(){

    ["list2","list3"]
    .forEach(id=>{

        document
        .getElementById(id)
        .querySelectorAll(".task")
        .forEach(task=>{

            task.classList
                .remove("done");

            task
            .querySelector(".check-btn")
            .textContent = "";
        });
    });

    saveData();
}

/* ===== Enterで追加 ===== */

document
.getElementById("input1")
.addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){

        addTask("list1","input1");
    }
});

document
.getElementById("input4")
.addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){

        addTask("list4","input4");
    }
});

/* ===== 初回 ===== */

loadData();
updateProgress();

</script>

</body>
</html>
